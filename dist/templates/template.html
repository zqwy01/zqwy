<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><link rel="stylesheet" href="{{assetPrefix}}styles/style.css"><link rel="stylesheet" href="{{assetPrefix}}styles/backgrounds/{{releaseName}}_background.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/menu/menu.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/player/player.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/player/wavesurfer.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/cover/cover.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/tracklist/tracklist.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/tracklist/download_links.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/markdown/markdown.css"><link rel="stylesheet" href="{{assetPrefix}}styles/fonts/font.css"><script src="{{assetPrefix}}scripts/containers/player/player_mini.js" defer="defer"></script><script src="{{assetPrefix}}scripts/containers/tracklist/tracklist.js" defer="defer"></script><script src="{{assetPrefix}}scripts/containers/markdown/markdown_images.js" defer="defer"></script><script src="{{assetPrefix}}scripts/containers/menu/menu.js" defer="defer"></script></head><body><main class="page"><div class="page-background"></div><div class="page-content"><div class="container menu-button-container" id="menuButtonContainer"><div class="menu-trigger-row"><button class="menu-open-button" id="menuOpenButton" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="siteMenu"><img class="menu-open-image" src="../{{assetPrefix}}src/icons/favicon.ico" alt="" aria-hidden="true"></button><form class="menu-inline-search" id="menuInlineSearch" role="search" aria-label="Поиск"><label class="visually-hidden" for="menuInlineSearchInput">Поиск</label> <input class="menu-search-input" id="menuInlineSearchInput" name="search" type="search" placeholder="Поиск" autocomplete="off" aria-label="Поиск"></form></div></div><div class="container title-container"><h1 class="title">{{title}}</h1></div><div class="container tags-container">{{tags}}</div><div class="container cover-container"><img class="cover" src="{{coverPrefix}}covers/{{releaseName}}/{{releaseName}}.webp" alt="Обложка альбома «{{title}}»"></div><div class="audio-player-slot" id="audioPlayerSlot"><div class="audio-player-container" id="audioPlayer"><div class="tc-player-switcher" id="albumPlayer" data-src="{{firstTrackSrc}}" data-available-players="html5,wavesurfer"></div></div></div><details class="text-container album"><summary class="album-heading"><h2 class="album-title">Треклист</h2><span class="album-arrow" aria-hidden="true">⌄</span></summary><div class="album-content"><ol class="track-list">{{tracks}}</ol></div></details><div class="text-container">{{description}}</div><script type="module" src="{{assetPrefix}}scripts/containers/player/player_switcher.js"></script></div></main><footer class="site-footer"><span class="site-version">Версия 1.0.0</span></footer><div class="site-menu-overlay" id="siteMenu" aria-hidden="true"><div class="site-menu-backdrop" data-menu-close aria-hidden="true"></div><section class="site-menu" role="dialog" aria-modal="true" aria-labelledby="siteMenuTitle"><header class="site-menu-header"><h2 class="site-menu-title" id="siteMenuTitle">Меню</h2><button class="site-menu-close" type="button" aria-label="Закрыть меню" data-menu-close>×</button></header><nav class="site-menu-content" aria-label="Основное меню"><button class="site-menu-button" type="button"><span class="site-menu-button-icon" aria-hidden="true">▦ </span><span>Каталог</span></button> <button class="site-menu-button" type="button"><span class="site-menu-button-icon" aria-hidden="true">⚙ </span><span>Настройки</span></button> <button class="site-menu-button" type="button"><span class="site-menu-button-icon" aria-hidden="true">◐ </span><span>Стиль</span></button></nav></section></div></body></html>
