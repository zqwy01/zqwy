<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a08">
<title>НЕМЕТОН — Песнь Древа</title>
<link rel="stylesheet" href="style.css">
<script>
  // Небольшой сборщик ошибок: помогает диагностировать запуск без консоли.
  window.__nemetonErrors = [];
  window.addEventListener('error', function (e) {
    window.__nemetonErrors.push(String((e && e.message) || e));
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.__nemetonErrors.push('promise: ' + String((e && e.reason) || e));
  });
</script>
</head>
<body>
<div id="boot">
  <div class="boot-mark" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
  <div class="boot-title">НЕМЕТОН</div>
  <div class="boot-sub" id="boot-sub">РОЩА ПРОСЫПАЕТСЯ…</div>
  <div class="boot-bar"><i id="boot-bar"></i></div>
</div>

<main id="stage">
  <canvas id="world" width="480" height="270" aria-label="Священная роща друидов"></canvas>
  <canvas id="ui" aria-hidden="true"></canvas>
</main>

<script src="js/chart.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
