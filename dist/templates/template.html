<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><link rel="stylesheet" href="{{assetPrefix}}styles/style.css"><link rel="stylesheet" href="{{assetPrefix}}styles/backgrounds/{{releaseName}}_background.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/menu/menu.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/menu/menu-logo.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/tags/tags.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/player/player.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/player/wavesurfer.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/cover/cover.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/tracklist/tracklist.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/tracklist/download_links.css"><link rel="stylesheet" href="{{assetPrefix}}styles/containers/markdown/markdown.css"><link rel="stylesheet" href="{{assetPrefix}}styles/fonts/font.css"><link rel="stylesheet" href="{{assetPrefix}}styles/selection.css"><script src="{{assetPrefix}}scripts/containers/player/player_mini.js" defer="defer"></script><script src="{{assetPrefix}}scripts/containers/tracklist/tracklist.js" defer="defer"></script><script src="{{assetPrefix}}scripts/containers/markdown/markdown_images.js" defer="defer"></script><script src="{{assetPrefix}}scripts/containers/menu/menu.js" defer="defer"></script></head><body><main class="page"><div class="page-background"></div><div class="page-content">{{menu}}<div class="container title-container"><h1 class="title">{{title}}</h1></div><div class="container tags-container">{{tags}}</div><div class="container cover-container"><img class="cover" src="{{coverPrefix}}covers/{{releaseName}}/{{releaseName}}.webp" alt="Обложка альбома «{{title}}»"></div><div class="audio-player-slot" id="audioPlayerSlot"><div class="audio-player-container" id="audioPlayer"><div class="tc-player-switcher" id="albumPlayer" data-src="{{firstTrackSrc}}" data-available-players="html5,wavesurfer"></div></div></div><details class="text-container album"><summary class="album-heading"><h2 class="album-title">Треклист</h2><span class="album-arrow" aria-hidden="true">⌄</span></summary><div class="album-content"><ol class="track-list">{{tracks}}</ol></div></details><div class="text-container">{{description}}</div><script type="module" src="{{assetPrefix}}scripts/containers/player/player_switcher.js"></script></div></main><footer class="site-footer"><span class="site-version">Версия 1.0.0</span></footer></body></html>
