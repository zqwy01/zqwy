<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>zqwy — граф заметок</title>
  <meta name="description" content="Интерактивный граф связей между заметками: несколько движков, фильтры и прогулка по заметкам">
  <link rel="icon" href="../../assets/icons/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../../styles/menu/menu.css">
  <link rel="stylesheet" href="../../styles/menu/menu_logo.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/notes.css">
  <link rel="stylesheet" href="../../styles/graph.css">
  <link rel="stylesheet" href="../../styles/player.css">
  <link rel="preload" href="../../data/note-graph.json" as="fetch" type="application/json" crossorigin>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("zqwy.site.settings.v1");
        var s = raw ? JSON.parse(raw) : null;
        var theme = s && s.theme ? s.theme : "dark";
        if (theme === "system") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
        document.documentElement.lang = s && s.language === "en" ? "en" : "ru";
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
</head>
<body>
  <main class="page">
    <div class="page-content graph-page">
      <div class="container menu-button-container" id="menuButtonContainer">
        <div class="menu-trigger-row">
          <a class="menu-open-button" id="menuOpenButton" href="../../" data-back aria-label="Назад" data-i18n-aria-label="back">
            <img class="menu-open-image" src="../../assets/icons/favicon.ico" alt="" aria-hidden="true">
          </a>
          <form class="site-search" id="siteSearch" role="search" aria-label="Поиск" data-i18n-aria-label="siteSearch">
            <label class="visually-hidden" for="siteSearchInput" data-i18n="siteSearchLabel">Общий поиск сайта</label>
            <input class="menu-search-input" id="siteSearchInput" name="search" type="search" placeholder="Поиск" autocomplete="off" enterkeyhint="search" aria-keyshortcuts="Control+F Meta+F" title="Общий поиск сайта (Ctrl+F)" data-i18n-placeholder="searchPlaceholder" data-i18n-title="searchTitle">
          </form>
        </div>
      </div>

      <header class="home-head graph-head">
        <h1 class="home-title">zqwy graph</h1>
        <p class="home-heading" data-i18n="graphHeading">Связи между заметками. Тяните узлы, фильтры — по вкусу.</p>
        <p class="home-heading blog-hint dim" data-i18n="graphHint">Двойной клик по заметке — открыть. Пробел — пауза, F — вписать, / — поиск.</p>
        <a class="notes-back" href="../zqwy/"><span aria-hidden="true">←</span> <span data-i18n="notesBack">Назад к заметкам</span></a>
      </header>

      <section class="graph-toolbar" id="graphToolbar" aria-label="Настройки графа">
        <div class="graph-toolbar-row graph-toolbar-row-buttons">
          <fieldset class="graph-group graph-engines-group">
            <legend data-i18n="graphEngines">Движок</legend>
            <div class="graph-engine-list" id="graphEngines"><span class="graph-muted">…</span></div>
          </fieldset>
          <fieldset class="graph-group graph-actions-group">
            <legend data-i18n="graphActions">Действия</legend>
            <div class="graph-action-list" id="graphActions">
              <button type="button" data-action="fit" data-i18n="graphFit">Вписать</button>
              <button type="button" data-action="motion" data-i18n="graphPause">Пауза</button>
              <button type="button" data-action="walk" data-i18n="graphWalk">Прогулка</button>
              <button type="button" data-action="reset" data-i18n="graphReset">Сброс</button>
              <button type="button" data-action="fullscreen" data-i18n="graphFullscreen" data-i18n-title="graphFullscreen" title="Полный экран">Полный экран</button>
            </div>
          </fieldset>
        </div>
        <div class="graph-toolbar-row graph-toolbar-row-search">
          <label class="graph-field graph-search-field">
            <span data-i18n="graphSearch">Поиск по графу</span>
            <input id="graphSearch" type="search" placeholder="название, текст, раздел" autocomplete="off" enterkeyhint="search">
          </label>
        </div>
        <div class="graph-toolbar-row graph-toolbar-row-filters">
          <label class="graph-field graph-section-field">
            <span data-i18n="graphFilter">Раздел</span>
            <select id="graphSection"><option value="">— все —</option></select>
          </label>
          <fieldset class="graph-group">
            <legend>Связи</legend>
            <div class="graph-kind-list" id="graphKinds">
              <label class="graph-kind graph-kind-reference"><input type="checkbox" value="reference" checked><span>ссылки</span></label>
              <label class="graph-kind graph-kind-series"><input type="checkbox" value="series" checked><span>серии</span></label>
              <label class="graph-kind graph-kind-similar"><input type="checkbox" value="similar" checked><span>похожие</span></label>
            </div>
          </fieldset>
        </div>
      </section>

      <section class="graph-workspace">
        <div class="graph-stage" id="graphStage">
          <div class="graph-host" id="graphHost" role="application" aria-label="Граф заметок"></div>
          <div class="graph-loading" id="graphLoading" role="status" aria-live="polite">
            <div class="graph-loading-card">
              <span class="graph-loading-ring" aria-hidden="true"></span>
              <strong class="graph-loading-title" id="graphLoadingTitle">Загрузка графа…</strong>
              <span class="graph-loading-detail" id="graphLoadingDetail"></span>
              <span class="graph-loading-track" aria-hidden="true"><span class="graph-loading-fill" id="graphLoadingFill"></span></span>
              <button type="button" class="graph-loading-retry" id="graphLoadingRetry" hidden>Повторить</button>
            </div>
          </div>
          <div class="graph-tooltip" id="graphTooltip" hidden></div>
          <div class="graph-empty" id="graphEmpty" hidden>Заметки или данные графа не найдены. Запустите <code>npm run notes</code>.</div>
          <aside class="graph-details" id="graphDetails" aria-label="Заметка" hidden>
            <button type="button" class="graph-details-close" id="graphDetailsClose" aria-label="Закрыть">×</button>
            <div id="graphDetailsBody"></div>
          </aside>
        </div>
        <p class="graph-status" id="graphStatus" aria-live="polite">Загрузка графа…</p>
        <noscript><p class="graph-status">Для графа нужен JavaScript. Обычный список заметок: <a href="../zqwy/">../zqwy/</a>.</p></noscript>
      </section>
    </div>
  </main>
  <script src="../../scripts/transition.js" type="module"></script>
  <script src="../../scripts/menu.js" type="module"></script>
  <script src="../../scripts/player.js" type="module"></script>
  <script src="../../scripts/graph.js" type="module"></script>
</body>
</html>
