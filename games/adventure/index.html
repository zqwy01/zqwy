<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e2">
<meta name="description" content="«Клетчатый лист» — тихая карандашная история о девочке, которая просыпается на листе бумаги и собирает фрагменты воспоминаний.">
<title>Клетчатый лист</title>
<link rel="stylesheet" href="style.css">
<script>
  // Диагностика для запуска без консоли: ошибки складываются в массив.
  window.__kletchatyyErrors = [];
  window.addEventListener('error', function (e) {
    window.__kletchatyyErrors.push(String((e && e.message) || e));
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.__kletchatyyErrors.push('promise: ' + String((e && e.reason) || e));
  });
</script>
</head>
<body>
<main id="app">
  <canvas id="stage" aria-label="Клетчатый лист: поле из клеток, по которому идёт нарисованная девочка"></canvas>

  <header id="hud" class="hud" hidden>
    <div class="hud-frag">
      <span id="frag-label" class="hud-label">Фрагменты</span>
      <span id="hearts" class="hearts" aria-hidden="true"></span>
      <span id="frag-count" class="hud-count" aria-live="polite">0 / 7</span>
    </div>
    <div class="hud-zone">
      <span id="zone-kicker" class="hud-kicker"></span>
      <strong id="zone-title" class="hud-title"></strong>
    </div>
    <div class="hud-actions">
      <button id="btn-sound" class="icon-btn" type="button" aria-pressed="false"></button>
      <button id="btn-pause" class="icon-btn pause-btn" type="button"><span></span><span></span></button>
    </div>
  </header>

  <div id="banner" class="banner" aria-live="polite" hidden></div>
  <div id="hint" class="hint" role="status" hidden></div>
  <div id="overlay" class="overlay" role="dialog" aria-modal="true" hidden></div>
</main>

<noscript>
  <p class="noscript">Для игры «Клетчатый лист» нужен JavaScript.</p>
</noscript>

<script src="js/levels.js"></script>
<script src="js/assets.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
