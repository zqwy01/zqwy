services:
  zqwy_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zqwy_web
    restart: always
    environment:
      - TZ=Europe/Moscow
      - PORT=3000
    volumes:
      # Site build is taken from the host, not baked into the image.
      - ./dist:/app/dist:ro
    networks:
      - zqwy_reverse_proxy

networks:
  zqwy_reverse_proxy:
    name: zqwy_reverse_proxy
    external: true
