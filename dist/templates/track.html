<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>{{title}}</title>
{{canonical}}

  <link rel="stylesheet" href="{{assetPrefix}}styles/style.css">
  <link rel="stylesheet" href="{{assetPrefix}}styles/containers/menu/menu.css">
  <link rel="stylesheet" href="{{assetPrefix}}styles/containers/menu/menu_logo.css">

  <link rel="stylesheet" href="{{assetPrefix}}styles/containers/tags/tags.css">
  <link rel="stylesheet" href="{{assetPrefix}}styles/containers/trackfields/trackfields.css">

  <link rel="stylesheet" href="{{assetPrefix}}styles/containers/player/player.css">
  <link rel="stylesheet" href="{{assetPrefix}}styles/containers/player/wavesurfer.css">

  <link rel="stylesheet" href="{{assetPrefix}}styles/containers/tracklist/download_links.css">

  <link rel="stylesheet" href="{{assetPrefix}}styles/containers/markdown/markdown.css">
  <link rel="stylesheet" href="{{assetPrefix}}styles/fonts/font.css">
  <link rel="stylesheet" href="{{assetPrefix}}styles/selection.css">

  <script
    src="{{assetPrefix}}scripts/containers/player/player_mini.js"
    defer
  ></script>

  <script
    src="{{assetPrefix}}scripts/containers/menu/menu.js"
    defer
  ></script>
</head>

<body class="track-page">
  <main class="page">
    <div class="page-background"></div>

    <div class="page-content">
      {{menu}}

      <div class="container title-container">
        <h1 class="title">{{title}}</h1>
      </div>

      {{tags}}

      {{trackPlayer}}

      {{trackFields}}

      {{trackDescription}}

      {{trackDownloads}}

      <script
        type="module"
        src="{{assetPrefix}}scripts/containers/player/player_switcher.js"
      ></script>
    </div>
  </main>

  <footer class="site-footer">
    <span class="site-version">Версия 1.0.0</span>
  </footer>
</body>
</html>
