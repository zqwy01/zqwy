services:
  tiddlywiki:
    build:
      context: .
    container_name: tiddlywiki
    restart: unless-stopped

    environment:
      TW_PORT: 1112
    volumes:
      - ./tiddlywiki-data:/var/lib/tiddlywiki
    expose:
      - "1112"
    networks:
      - tiddlywiki_reverse_proxy

networks:
  tiddlywiki_reverse_proxy:
    external: true
